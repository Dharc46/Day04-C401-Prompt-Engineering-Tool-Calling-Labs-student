tools:
  - name: clarify
    description: "Ask the user for one missing required detail or confirmation. Use this instead of guessing accounts, URLs, or action approval."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "The concise question to ask the user."}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Expected answer type."}
        options: {type: array, default: [], items: {type: string}, description: "Choices when response_type is choice."}
      required: [question]

  - name: timeline
    description: "Fetch recent posts/tweets from one specific account. Use only when the account/person is known."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Account handle without @, e.g. sama, elonmusk, karpathy."}
        limit: {type: integer, default: 5, description: "Number of recent posts to retrieve."}
      required: [screenname]

  - name: social_search
    description: "Search social posts/tweets by topic or keyword across accounts. Use Latest by default and Top for popular/top requests."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Topic or keyword to search."}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Latest for recent posts; Top for popular/top posts."}
        limit: {type: integer, default: 5, description: "Number of posts to retrieve."}
      required: [query]

  - name: lookup
    description: "Search the web for general information or current news. Use topic=news for news/current-event requests."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Short web search query."}
        topic: {type: string, enum: [general, news], default: "general", description: "news for current/news requests; general otherwise."}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "day=today, week=this week, month=this month, year=this year."}
        max_results: {type: integer, default: 5, description: "Number of results."}
      required: [query]

  - name: fetch
    description: "Read or summarize a specific URL supplied by the user. A supplied URL is enough to call this tool; ask clarify only when the URL is missing."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "The exact URL to read."}
      required: [url]

  - name: format
    description: "Render already available source items into a markdown digest. Use after retrieval when the user asks for a digest/brief/thread."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Retrieved items to format."
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Output format."}
        headline: {type: string, default: "", description: "Digest headline."}
      required: [items, template]

  - name: send
    description: "Send text to Telegram. Side-effecting action: before calling send, use clarify with response_type=yes_no unless the user has already explicitly confirmed."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Text to send."}
        confirmed: {type: boolean, default: false, description: "Must be true only after explicit confirmation."}
      required: [text]

  - name: policy
    description: "Search the local company policy knowledge base for rules about AI research, citations, privacy, publishing, or tool use."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Policy question or keywords."}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Policy area to search."}
        top_k: {type: integer, default: 3, description: "Number of policy snippets."}
      required: [query]

  - name: papers
    description: "Search arXiv for academic papers."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Paper search query."}
        max_results: {type: integer, default: 5, description: "Number of papers."}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sort order."}
      required: [query]

  - name: paper_text
    description: "Download/extract text from an arXiv paper by ID or URL."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "arXiv ID, abstract URL, or PDF URL."}
        max_pages: {type: integer, default: 5, description: "Maximum PDF pages to extract."}
        max_chars: {type: integer, default: 8000, description: "Maximum returned characters."}
      required: [arxiv_url]

  - name: source_rank
    description: "Rank, filter, and deduplicate already retrieved or user-supplied source items by relevance and source quality. Do not use with an empty item list."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Source items with title, url, source, summary, and optional score."
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              score: {type: number}
        query: {type: string, default: "", description: "User topic used to score relevance."}
        top_k: {type: integer, default: 5, description: "Maximum ranked items to return."}
        prefer_primary: {type: boolean, default: true, description: "Boost primary/official sources when true."}
      required: [items]

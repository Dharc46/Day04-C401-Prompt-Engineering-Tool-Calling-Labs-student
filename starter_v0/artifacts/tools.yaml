# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Hỏi lại người dùng khi thiếu thông tin bắt buộc hoặc cần xác nhận trước khi thực hiện hành động. Dùng response_type 'yes_no' khi cần xác nhận hành động (gửi, đăng, xuất bản). Dùng response_type 'text' khi cần thông tin còn thiếu (screenname, URL, v.v.)."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [response_type]

  - name: timeline
    description: "Lấy bài đăng gần đây của một tài khoản trên mạng xã hội. Screenname là bắt buộc và phải do người dùng cung cấp — không được tự đoán."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Tên tài khoản"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [screenname]

  - name: social_search
    description: "Tìm trên mạng xã hội."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [query]

  - name: lookup
    description: "Tra cứu thông tin trên internet. Use topic=news and timeframe=day for current news, and keep query just the subject term (do not append 'news')."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        topic: {type: string, enum: [general, news], default: "general", description: "Phân loại"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian"}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]

  - name: fetch
    description: "Lấy nội dung từ một địa chỉ."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ"}
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã có thành văn bản."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi một đoạn văn bản đi. Only actually send when confirmed=true after an explicit yes/no confirmation."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung"}
        confirmed: {type: boolean, default: false, description: "Cờ xác nhận"}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]

  # ---------------- New tools ----------------
  - name: translate
    description: "Dịch văn bản giữa các ngôn ngữ. Dùng khi người dùng yêu cầu dịch/translate nội dung. Mặc định dịch từ tiếng Anh sang tiếng Việt."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Văn bản cần dịch"}
        source_lang: {type: string, default: "en", description: "Ngôn ngữ nguồn (mã ISO 639-1)"}
        target_lang: {type: string, default: "vi", description: "Ngôn ngữ đích (mã ISO 639-1)"}
      required: [text]

  - name: trending
    description: "Lấy danh sách chủ đề đang thịnh hành (trending) trên Twitter/X. Dùng khi người dùng hỏi gì đang hot/trending/nổi bật trên mạng xã hội mà KHÔNG chỉ định từ khóa cụ thể. Khác với social_search (tìm theo từ khóa)."
    parameters:
      type: object
      properties:
        country: {type: string, default: "vietnam", description: "Quốc gia (tên tiếng Anh)"}
        limit: {type: integer, default: 10, description: "Số lượng"}
      required: []

  - name: youtube
    description: "Tìm video trên YouTube. Dùng khi người dùng yêu cầu tìm video hoặc nói rõ YouTube. Khác với lookup (tìm web) và social_search (tìm tweet)."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa tìm kiếm"}
        limit: {type: integer, default: 5, description: "Số lượng video"}
        sort_by: {type: string, enum: [relevance, date, viewCount], default: "relevance", description: "Cách sắp xếp"}
      required: [query]

  - name: github_search
    description: "Tìm repository trên GitHub. Dùng khi người dùng hỏi về repo, mã nguồn mở, hoặc project trên GitHub. Khác với lookup (tìm web chung)."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa tìm kiếm"}
        sort: {type: string, enum: [stars, updated, forks], default: "stars", description: "Cách sắp xếp"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [query]

  - name: save
    description: "Lưu kết quả nghiên cứu vào file cục bộ. Dùng khi người dùng yêu cầu lưu/save/export kết quả. Khác với send (gửi lên Telegram — cần xác nhận) và format (chỉ trình bày, không lưu)."
    parameters:
      type: object
      properties:
        content: {type: string, default: "", description: "Nội dung cần lưu"}
        filename: {type: string, default: "", description: "Tên file (tự tạo nếu bỏ trống)"}
        format: {type: string, enum: [txt, md, json], default: "md", description: "Định dạng file"}
      required: [content]
